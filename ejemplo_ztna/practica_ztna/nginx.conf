worker_processes 1;
pid ./nginx.pid;
error_log ./nginx_error.log info;

events {
    worker_connections 1024;
}

http {
    server_tokens off;                      # no revelar la versión de nginx

    # Temporales dentro del proyecto (sin root no se puede escribir en /var/lib/nginx)
    client_body_temp_path ./tmp/client_body;
    proxy_temp_path       ./tmp/proxy;
    fastcgi_temp_path     ./tmp/fastcgi;
    uwsgi_temp_path       ./tmp/uwsgi;
    scgi_temp_path        ./tmp/scgi;

    include conf/logging.conf;              
    include conf/secreto_gateway.conf;      
    include conf/authz_maps.conf;          

    server {
        listen 8443 ssl;
        server_name localhost;

        include conf/tls_mtls.conf;         
        include conf/authz.conf;            
    }
}