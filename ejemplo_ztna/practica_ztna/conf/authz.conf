proxy_set_header Host            $host;
proxy_set_header X-Client-DN     $ssl_client_s_dn;
proxy_set_header X-Client-Serial $ssl_client_serial;
proxy_set_header X-Client-Roles  $ztna_roles;
proxy_set_header X-Request-ID    $request_id;
proxy_set_header X-Gateway-Token $ztna_gateway_token;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff"          always;
add_header Cache-Control             "no-store"         always;

location / {
    return 404;
}

location = /rrhh {
    limit_except GET { deny all; }
    auth_request     /_pdp/rrhh;
    auth_request_set $ztna_roles $upstream_http_x_ztna_roles;
    proxy_pass http://127.0.0.1:8001/rrhh;
}

location = /finanzas {
    limit_except GET { deny all; }
    auth_request     /_pdp/finanzas;
    auth_request_set $ztna_roles $upstream_http_x_ztna_roles;
    proxy_pass http://127.0.0.1:8002/finanzas;
}

location ^~ /_pdp/ {
    internal;
    proxy_pass              http://127.0.0.1:8003/decidir/;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length  "";
    proxy_set_header        X-Client-DN     $ssl_client_s_dn;
    proxy_set_header        X-Client-Issuer $ssl_client_i_dn;
    proxy_set_header        X-Request-ID    $request_id;
}
