# =====================================================================
# conf/authz.conf - Autorización (Parte 2). Se incluye en server {}
# =====================================================================

# Cabeceras hacia los backends. proxy_set_header SOBRESCRIBE lo que
# mande el cliente, así que no se pueden falsificar desde fuera.
# (Se heredan en las location que no definen proxy_set_header propios.)
proxy_set_header Host            $host;
proxy_set_header X-Client-DN     $ssl_client_s_dn;
proxy_set_header X-Client-Serial $ssl_client_serial;
proxy_set_header X-Client-Roles  $ztna_roles;
proxy_set_header X-Request-ID    $request_id;
proxy_set_header X-Gateway-Token $ztna_gateway_token;

# Cabeceras de seguridad en las respuestas
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff"          always;
add_header Cache-Control             "no-store"         always;

# Denegación por defecto: lo que no está publicado explícitamente no existe
location / {
    return 404;
}

# RRHH: coincidencia EXACTA (antes era un prefijo y /rrhhXYZ también entraba)
location = /rrhh {
    limit_except GET { deny all; }          # solo GET/HEAD; POST, PUT... -> 403
    if ($ztna_permitido_rrhh = 0) {
        return 403;
    }
    proxy_pass http://127.0.0.1:8001/rrhh;       # reenvía la ruta ya normalizada
}

# Finanzas: solo personal con rol finanzas (mínimo privilegio)
location = /finanzas {
    limit_except GET { deny all; }
    if ($ztna_permitido_finanzas = 0) {
        return 403;
    }
    proxy_pass http://127.0.0.1:8002/finanzas;   # reenvía la ruta ya normalizada
}
