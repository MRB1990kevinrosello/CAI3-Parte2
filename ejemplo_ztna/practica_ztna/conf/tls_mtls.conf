# Certificado del servidor (TLS básico)
        ssl_certificate     ./pki/server_fullchain.crt;
        ssl_certificate_key ./pki/server.key;
        ssl_protocols TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache off;
        ssl_verify_client on;
        ssl_client_certificate ./pki/chain_empleados.crt;
        ssl_verify_depth 2;
        ssl_crl ./pki/crl.pem;

# Solo certificados emitidos por la Sub-CA de Empleados
if ($ssl_client_i_dn != "CN=Sub-CA Empleados,O=Hospital_Insegus,C=ES") {
    return 403;
}