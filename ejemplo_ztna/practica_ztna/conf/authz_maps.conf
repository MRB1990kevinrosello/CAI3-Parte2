map $ssl_client_s_dn $ztna_roles {
    "~^CN=[^,]+,OU=Finanzas,O=Hospital_Insegus,C=ES$"   "empleado,finanzas";
    "~^CN=[^,]+,OU=[^,]+,O=Hospital_Insegus,C=ES$"      "empleado";
    default                                              "";
}

map $ztna_roles $ztna_permitido_rrhh {
    "~(^|,)empleado(,|$)"   1;
    default                 0;
}

map $ztna_roles $ztna_permitido_finanzas {
    "~(^|,)finanzas(,|$)"   1;
    default                 0;
}
